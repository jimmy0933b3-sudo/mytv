name: Android CI and Signed Release

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mytv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests and debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      # Never expose a signing key to pull_request jobs.
      - name: Restore fixed signing key from Actions Secrets
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions Secret: $name. Previous Release is preserved."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/mytv-release.jks"
          test -s "$RUNNER_TEMP/mytv-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/mytv-release.jks" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          echo "Release keystore and alias verified"

      - name: Build signed Release APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mytv-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version_code="$((10000 + GITHUB_RUN_NUMBER))"
          ./gradlew --no-daemon :app:assembleRelease "-PciVersionCode=$version_code"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          echo "APP_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Verify signed APK and signing certificate
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt2="$(find "$sdk_root/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt2"
          "$apksigner" verify --verbose "$apk"
          # Read the entire output instead of short-circuiting a pipeline with
          # pipefail enabled, which can cause SIGPIPE and a false build failure.
          cert_output="$("$apksigner" verify --print-certs "$apk")"
          signer_sha256="$(awk 'tolower($0) ~ /certificate sha-256 digest:/ {print $NF; exit}' <<< "$cert_output")"
          if [[ ! "$signer_sha256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Could not read the signed APK certificate SHA-256"
            printf '%s\n' "$cert_output"
            exit 1
          fi
          # aapt dump badging tries to resolve framework icon resources and can
          # fail even for a valid APK. aapt2 packagename reads only the manifest.
          package_name="$("$aapt2" dump packagename "$apk")"
          if [[ "$package_name" != "com.taiwanfreetv.app" ]]; then
            echo "::error::Unexpected APK package ID: $package_name"
            exit 1
          fi
          echo "SIGNER_SHA256=$signer_sha256" >> "$GITHUB_ENV"
          cp "$apk" mytv-latest.apk
          echo "### Verified signed APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing certificate SHA-256: \`$signer_sha256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionCode: \`$APP_VERSION_CODE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish newest Release and delete old releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)"
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "Newer branch commit detected. Stale build will not overwrite latest."
            exit 0
          fi

          previous_signer="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .body 2>/dev/null |
            sed -n 's/^Signer SHA256: //p' | head -n 1 || true)"
          if [[ -n "$previous_signer" && "$previous_signer" != "$SIGNER_SHA256" ]]; then
            echo "::error::Signing certificate differs from the latest Release. Old Release preserved."
            exit 1
          fi

          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          tag="v${version_name}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          notes="$(printf 'Android signed release.\nCommit: %s\nSigner SHA256: %s\nversionCode: %s\n' \
            "$GITHUB_SHA" "$SIGNER_SHA256" "$APP_VERSION_CODE")"

          # Publish and verify the replacement first. Never delete the last good
          # Release when signing, building, uploading, or verification fails.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" mytv-latest.apk --clobber
            gh release edit "$tag" --latest --target "$GITHUB_SHA" \
              --title "mytv $tag" --notes "$notes"
          else
            gh release create "$tag" mytv-latest.apk --target "$GITHUB_SHA" --latest \
              --title "mytv $tag" --notes "$notes"
          fi
          count="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '[.assets[] | select(.name == "mytv-latest.apk" and .size > 0 and .state == "uploaded")] | length')"
          if [[ "$count" != 1 ]]; then
            echo "::error::The new signed APK was not uploaded successfully. Old Releases preserved."
            exit 1
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' |
            while IFS= read -r old_tag; do
              [[ -z "$old_tag" || "$old_tag" == "$tag" ]] && continue
              gh release delete "$old_tag" --yes --cleanup-tag
            done
          echo "### Latest Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`mytv-latest.apk\`" >> "$GITHUB_STEP_SUMMARY"
